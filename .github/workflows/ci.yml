name: Validate gateway and frontend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-quest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-gateway-isolation.cjs
      - run: node contracts/validar-inventario.cjs
      # Java/JUnit, PostgreSQL IT and release remain in the separate supervised pipeline stage.
      # No provider hooks or database migrations run from this workflow.
