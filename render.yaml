# Gateway + frontend only. Provision the three Java services and their databases separately.
services:
  - type: web
    name: stock-quest
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w @stock-quest/gateway
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_WEB
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: PEOPLE_SERVICE_URL
        sync: false
      - key: LEARNING_SERVICE_URL
        sync: false
      - key: SIMULATION_SERVICE_URL
        sync: false
      - key: LEARNING_SERVICE_TOKEN
        sync: false
      - key: SIMULATION_SERVICE_TOKEN
        sync: false
