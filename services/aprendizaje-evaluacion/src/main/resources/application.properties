spring.application.name=aprendizaje-evaluacion
server.port=${LEARNING_PORT:4020}
server.address=${LEARNING_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${LEARNING_JDBC_URL}
spring.datasource.username=${LEARNING_DB_USER}
spring.datasource.password=${LEARNING_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never
learning.identity-me-url=${IDENTITY_ME_URL:http://127.0.0.1:4000/api/auth/me}
learning.service-token=${LEARNING_SERVICE_TOKEN:}
learning.event-token=${SIMULATION_EVENT_TOKEN:}
learning.simulation-url=${SIMULATION_SERVICE_URL:http://127.0.0.1:4010}
learning.simulation-token=${SIMULATION_SERVICE_TOKEN:}
