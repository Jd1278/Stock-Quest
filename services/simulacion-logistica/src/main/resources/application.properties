spring.application.name=simulacion-logistica
server.port=${SIMULATION_PORT:4010}
server.address=${SIMULATION_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${SIMULATION_JDBC_URL}
spring.datasource.username=${SIMULATION_DB_USER}
spring.datasource.password=${SIMULATION_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
simulation.identity-me-url=${IDENTITY_ME_URL:http://127.0.0.1:4000/api/auth/me}
simulation.service-token=${SIMULATION_SERVICE_TOKEN:}
simulation.events.enabled=${SIMULATION_EVENTS_ENABLED:false}
simulation.events.target=${SIMULATION_EVENTS_TARGET:http://127.0.0.1:4000/internal/events}
simulation.events.token=${SIMULATION_EVENT_TOKEN:}
