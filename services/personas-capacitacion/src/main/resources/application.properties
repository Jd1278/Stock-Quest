spring.application.name=personas-capacitacion
server.port=${PEOPLE_PORT:4030}
server.address=${PEOPLE_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${PEOPLE_JDBC_URL}
spring.datasource.username=${PEOPLE_DB_USER}
spring.datasource.password=${PEOPLE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never
people.jwt-secret=${PEOPLE_JWT_SECRET}
people.jwt-duration=${PEOPLE_JWT_EXPIRES_IN:8h}
people.service-token=${PEOPLE_SERVICE_TOKEN:}
people.learning-url=${LEARNING_SERVICE_URL:http://127.0.0.1:4020}
people.learning-token=${LEARNING_SERVICE_TOKEN:}
people.reports-mode=${PEOPLE_REPORTS_MODE:http}
